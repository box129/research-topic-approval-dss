# The external HTTPS edge must sanitize X-Forwarded-Proto before it reaches
# this container. The container-to-container hop is intentionally HTTP, so
# preserve that trusted public HTTPS signal rather than overwriting it with
# this hop's $scheme value. Local direct requests fall back to $scheme.
map $http_x_forwarded_proto $public_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker's embedded DNS lets the frontend follow a recreated backend
    # container rather than retaining the IP resolved during Nginx startup.
    # A non-Docker platform must provide an equivalent service resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    root /usr/share/nginx/html;
    index index.html;
    # The backend enforces a 5 MiB file limit. Leave room for multipart
    # boundaries and form fields so an otherwise valid maximum-size workbook
    # reaches that authoritative check.
    client_max_body_size 6m;
    client_body_timeout 300s;
    send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # API responses, especially session and credential-related responses,
        # must never be cached by the static frontend tier.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
