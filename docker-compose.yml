services:
  postgres:
    image: postgres:16-alpine
    container_name: topic-similarity-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-topic_similarity}
      POSTGRES_USER: ${POSTGRES_USER:-topic_similarity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topic_similarity_local_only_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sbert-service:
    build:
      context: ./sbert-service
    container_name: topic-similarity-sbert
    environment:
      LOG_LEVEL: ${SBERT_LOG_LEVEL:-INFO}
    ports:
      - "${SBERT_PORT:-8000}:8000"
    volumes:
      - sbert-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
    container_name: topic-similarity-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_VERSION: ${API_VERSION:-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-topic_similarity}:${POSTGRES_PASSWORD:-topic_similarity_local_only_password}@postgres:5432/${POSTGRES_DB:-topic_similarity}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-before-any-shared-environment}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      SBERT_SERVICE_URL: ${SBERT_SERVICE_URL:-http://sbert-service:8000}
      SBERT_TIMEOUT: ${SBERT_TIMEOUT:-30000}
      SBERT_RETRY_ATTEMPTS: ${SBERT_RETRY_ATTEMPTS:-3}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@localhost}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      AUDIT_LOG_PURGE_MIN_AGE_DAYS: ${AUDIT_LOG_PURGE_MIN_AGE_DAYS:-90}
      AUDIT_LOG_PURGE_MAX_BATCH: ${AUDIT_LOG_PURGE_MAX_BATCH:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      sbert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: topic-similarity-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  sbert-model-cache:
