# Render Blueprint — HOSTED STAGING ONLY (synthetic data).
#
# This describes the staging topology for the Research Topic Approval DSS:
#
#   Internet / Render HTTPS edge
#         -> PUBLIC frontend Nginx web service
#         -> (Render private network) PRIVATE Node/Express service
#         -> Render managed PostgreSQL
#         -> Voyage AI over outbound HTTPS
#         -> staging SMTP provider over outbound TLS
#
# It contains NO secret values. Everything credential-bearing is either
# generated by Render or marked `sync: false`, which means "this key exists,
# supply its value in the dashboard/API — never in Git".
#
# NOT YET DEPLOYED. No Render resources have been provisioned from this file.
#
# Field usage has been checked against Render's current Blueprint specification,
# and one round of real validator feedback has been applied:
#   - healthCheckPath is supported on type:web only and is rejected on a
#     private service, so the backend no longer declares one;
#   - autoDeploy is deprecated in favour of autoDeployTrigger (commit |
#     checksPass | off).
# Treat any further rejected field as spec drift to correct narrowly, never as a
# reason to weaken the architecture.

databases:
  - name: rtadss-staging-db
    databaseName: rtadss_staging
    user: rtadss_staging
    # Paid plan: free Render databases expire, which is unacceptable for a
    # staging database that backup/restore drills depend on.
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # No public ingress. The backend reaches the database over Render's private
    # network using the internal connection string.
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # PRIVATE backend. `type: pserv` has no public Internet URL by definition;
  # only services inside this Render private network can reach it.
  # ---------------------------------------------------------------------------
  - type: pserv
    name: rtadss-staging-backend
    runtime: docker
    region: frankfurt
    # Must not be a free instance: free services do not permit the outbound
    # SMTP traffic this phase has to prove, and bcrypt needs real CPU.
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Deliberate deploys only. A synchronous bulk-onboarding request can exceed
    # Render's maximum graceful-shutdown delay, so a deploy landing mid-import
    # can cut off a legitimate administrative operation.
    autoDeployTrigger: off
    # Longest shutdown delay Render supports (the field accepts 1-300). This is
    # NOT enough to drain a worst-case bulk commit; see the deployment lockout
    # rule in the runbook.
    maxShutdownDelaySeconds: 300
    numInstances: 1
    # Migrations run as a pre-deploy step: a migration failure must fail the
    # deploy rather than start a backend against an unmigrated schema.
    preDeployCommand: npm run prisma:migrate:deploy
    # No healthCheckPath here: Render supports HTTP health checks only on
    # type:web, and rejects the field on a private service. The platform
    # therefore health-checks this service over TCP against its listening port.
    #
    # That is a platform-restart signal only. It is weaker than the application
    # contract, because a TCP accept proves the socket is open, not that the
    # process can answer. The application's own endpoints are unchanged and
    # remain the authority:
    #   /api/v1/health     liveness   - the Node process can answer
    #   /api/v1/readiness  readiness  - database + Voyage + truthful email
    # Both must be exercised explicitly from the frontend origin during hosted
    # acceptance, and readiness must never be wired to a platform restart probe.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_VERSION
        value: v1

      # Internal connection string from the managed database above — never a
      # hardcoded host, never a committed password.
      - key: DATABASE_URL
        fromDatabase:
          name: rtadss-staging-db
          property: connectionString

      # Staging-only secret, generated by Render and never present in Git.
      # Production must receive its own separately installed secret.
      - key: JWT_SECRET
        generateValue: true

      # The public browser origin. Render assigns the frontend hostname at
      # creation time, so this is supplied once the frontend exists rather than
      # hardcoded here. It must be the exact https:// origin.
      - key: FRONTEND_URL
        sync: false
      # Same-origin deployment: leave CORS_ORIGIN unset so the single allowed
      # origin derives from FRONTEND_URL.
      - key: CORS_CREDENTIALS
        value: "true"

      # Reviewed proxy hop count for the Render edge -> frontend Nginx ->
      # backend chain. Set from OBSERVED forwarding headers on this platform,
      # never guessed, and never `true` or `*`.
      - key: TRUST_PROXY
        sync: false

      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: VOYAGE_READINESS_PROBE_CACHE_MS
        value: "300000"
      - key: VOYAGE_READINESS_STALE_GRACE_MS
        value: "60000"

      - key: SHUTDOWN_GRACE_PERIOD_MS
        value: "300000"

      # Real staging SMTP provider. Credentials are supplied out of band.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TIMEOUT_MS
        value: "10000"

      - key: INVITATION_EXPIRES_HOURS
        value: "168"
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: "30"

      # Leave BULK_HASH_CONCURRENCY unset: the application derives it from
      # physical cores bounded by the container's cgroup CPU allowance. Set it
      # explicitly only after measuring this instance type.
      - key: LOG_LEVEL
        value: info

  # ---------------------------------------------------------------------------
  # PUBLIC frontend. Serves the SPA and proxies /api/* to the private backend,
  # preserving the same-origin browser security model.
  # ---------------------------------------------------------------------------
  - type: web
    name: rtadss-staging-frontend
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: off
    numInstances: 1
    # Valid here: healthCheckPath is supported on type:web only.
    healthCheckPath: /
    envVars:
      # Service reference, not a generated hostname. Renders to host:port of the
      # private backend on this platform's internal network.
      - key: BACKEND_UPSTREAM
        fromService:
          name: rtadss-staging-backend
          type: pserv
          property: hostport

      # Render's internal DNS returns records the container can route; the
      # image detects the resolver from /etc/resolv.conf at start.
      - key: BACKEND_RESOLVER_FLAGS
        value: ipv6=off

      # Runtime acceptance measured ~324s for a 650-account onboarding request
      # and established a 600-second floor for every hop. 660s keeps margin.
      - key: PROXY_TIMEOUT
        value: 660s
