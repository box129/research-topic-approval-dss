# Local acceptance-only HTTPS edge.
#
# It exists so container acceptance can run the stack under the real
# production contract (NODE_ENV=production requires an https:// browser origin
# and issues Secure cookies) without weakening a single application setting
# for local convenience.
#
# It reproduces the documented public chain:
#   browser -> HTTPS edge -> frontend Nginx -> private backend
#
# This is verification tooling. It uses a self-signed certificate, is never
# published beyond 127.0.0.1, and is not a hosting recommendation.

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate     /etc/nginx/acceptance-certs/edge.crt;
    ssl_certificate_key /etc/nginx/acceptance-certs/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match the documented edge envelope: a 6 MiB multipart request and the
    # 300-second budget required by the ~142-second bulk onboarding operation.
    client_max_body_size 6m;
    client_body_timeout 300s;
    send_timeout 300s;

    # Re-resolve the frontend through Docker's embedded DNS. Without this an
    # Nginx tier pins the IP it resolved at startup and returns 502 after the
    # frontend container is recreated. The production frontend/nginx.conf
    # applies the same technique to the backend for the same reason.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:8080;

    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The edge is the authority on the public scheme. Frontend Nginx
        # preserves this value across its internal HTTP hop rather than
        # overwriting it with that hop's own http scheme.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
