services:
  sbert-service:
    build: .
    container_name: sbert-service
    # Historical research/evaluation only. The Voyage production topology uses
    # the root Compose contract and must never start this service implicitly.
    profiles: ["legacy-sbert"]
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      # Cache the model to avoid re-downloading
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  model-cache:
    driver: local
